<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    rel="stylesheet" />

            "outline": "#74796e",

            "outline-variant": "#c4c8bc",
            "on-tertiary-fixed-variant": "#514532",
            "background": "#fbf9f3",
            "surface-container-high": "#e9e8e2",

            "h2": ["32px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }],

  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>

<body class="bg-background font-body-md text-on-background selection:bg-secondary-container">
  <!-- Top Navigation Hidden for Focused Transactional Flow -->
  <main class="min-h-screen flex items-center justify-center p-md md:p-lg">
    <!-- Login Card -->
    <div
      class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl border border-outline-variant shadow-[0_24px_48px_-12px_rgba(83,106,66,0.08)] p-md md:p-xl transition-all hover:border-outline">
      <header class="flex flex-col items-center gap-base mb-lg text-center">
        <div class="h-12 w-12 bg-primary-container rounded-lg flex items-center justify-center mb-base">
          <span class="material-symbols-outlined text-white text-2xl" data-icon="auto_stories">auto_stories</span>
        </div>
        <h1 class="font-h2 text-h2 text-primary tracking-tight">Lumina Markdown</h1>
        <p class="font-body-sm text-body-sm text-on-surface-variant max-w-[280px]">
          Return to your focused learning environment and resume your deep work.
        </p>
      </header>
      <form class="space-y-md">
        <!-- Email Field -->
        <div class="space-y-xs">
          <label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Email</label>
          <div class="relative">
            <input
              class="w-full h-12 bg-surface-container-low border-b-2 border-outline-variant focus:border-primary focus:ring-0 px-md py-base transition-all font-body-md outline-none rounded-t-lg"
              id="email" placeholder="name@university.edu" type="email" />
          </div>
        </div>
        <!-- Password Field -->
        <div class="space-y-xs">
          <div class="flex justify-between items-center ml-1">
            <label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
            <a class="font-label-md text-label-md text-primary hover:underline decoration-2 underline-offset-4"
              href="#">Forgot password?</a>
          </div>
          <div class="relative">
            <input
              class="w-full h-12 bg-surface-container-low border-b-2 border-outline-variant focus:border-primary focus:ring-0 px-md py-base transition-all font-body-md outline-none rounded-t-lg"
              id="password" placeholder="••••••••" type="password" />
          </div>
        </div>
        <!-- Login Button -->
        <button
          class="w-full h-14 bg-primary text-on-primary font-h3 text-h3 rounded-lg hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-base mt-lg"
          type="button"
          onclick="window.location.href='dashboard.html'">
          Login
          <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
        </button>
      </form>
      <footer class="mt-xl pt-lg border-t border-outline-variant text-center">
        <p class="font-body-sm text-body-sm text-on-surface-variant">
          New to the workspace?
          <a class="text-primary font-label-md ml-xs hover:underline decoration-2 underline-offset-4" href="#">Sign
            up</a>
        </p>
      </footer>
    </div>
  </main>
  <!-- Side Illustration Background (Decorative atmospheric element) -->
  <div class="fixed top-0 right-0 w-1/3 h-full -z-10 pointer-events-none hidden lg:block opacity-40">
    <div class="absolute inset-0 bg-gradient-to-l from-secondary-container/20 to-transparent"></div>
    <img alt="Minimalist study environment" class="h-full w-full object-cover"
      data-alt="A serene and minimalist study environment featuring a clean wooden desk with a single open journal and a high-end fountain pen. The lighting is soft and natural, coming from a large window off-camera, creating long, gentle shadows across a textured sand-colored wall. The overall mood is academic, focused, and incredibly peaceful, with a color palette of soft greens, beiges, and muted whites that promote deep cognitive work."
      src="https://lh3.googleusercontent.com/aida-public/AB6AXuCcJpfBu3DAcC3F5XCJHkdHpRM75-CSbRtAX7TsaAHBPu_oyhscHSrNjrEWUV24oiD9EDZ3DZXs90gDpUQulW1fQu5dbW-8XpNhEwrvRAHAch4bfaS0qAYTDHNPDHckhXa5RDzrqIwlvY335MLqlmvBc4v54IuPSaTD4lmwi8cX2ljPe7njd3MBT3U46i46Mel-jbT1klpNb-ZhextuMSYQDsIXT7tl4kSTKm8mzBqxG_3NKNe-B4xks9QSoz-bOp_u5AR89VRK7cE" />
  </div>
  <div class="fixed bottom-0 left-0 w-1/3 h-1/2 -z-10 pointer-events-none hidden lg:block opacity-30">
    <div class="absolute inset-0 bg-gradient-to-tr from-primary-fixed/30 to-transparent"></div>
  </div>
</body>

</html>
