<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>로그인 · MarkLearn</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#fcd5d5; --green-1:#7dc89a; --green-2:#a9d68b; --olive:#c5d27a;
  --gray:#dcdcdc; --ink:#1f2937; --sub:#4b5563;
  --primary:#2438d6; --primary-2:#3b4dff; --bg:#f7f8fa; --line:#e5e7eb;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}

.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid #eee}
.nav-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 24px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.logo-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--green-1),var(--olive));display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;box-shadow:0 4px 12px rgba(125,200,154,.4)}
.nav-menu{display:flex;gap:28px;font-weight:600;color:var(--sub);font-size:15px}
.nav-menu a:hover,.nav-menu a.active{color:var(--ink)}
.nav-menu a.active{color:var(--primary)}
.nav-cta{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:14px}
.nav-cta:hover{background:#000}

footer{background:var(--pink);padding:30px 24px;text-align:center;color:#7a3b3b;font-size:13.5px;margin-top:80px}
footer .row{display:flex;justify-content:center;gap:22px;margin-bottom:8px;font-weight:600}

.container{max-width:1180px;margin:0 auto;padding:32px 24px}
.page-title{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.page-sub{color:var(--sub);margin-bottom:28px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;font-weight:700;font-size:14px;transition:transform .15s ease}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-2);transform:translateY(-1px)}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{background:#f3f4f6}
input[type=text],input[type=email],textarea,select{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px;background:#fff;color:var(--ink);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--primary)}

.login-wrap{min-height:calc(100vh - 140px);display:grid;place-items:center;padding:40px 20px}
.login-card{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:44px 36px;box-shadow:0 12px 40px rgba(0,0,0,.06);text-align:center}
.login-card .logo-mark{width:54px;height:54px;font-size:22px;margin:0 auto 18px}
.login-card h1{font-size:24px;font-weight:800;margin-bottom:8px}
.login-card p{color:var(--sub);font-size:14.5px;margin-bottom:30px}
.gh-btn{width:100%;padding:14px;background:#1f2937;color:#fff;border-radius:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px}
.gh-btn:hover{background:#000}
.divider{margin:22px 0;color:#9ca3af;font-size:12px;display:flex;align-items:center;gap:10px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#e5e7eb}
.tos{margin-top:18px;font-size:12px;color:#9ca3af}
</style></head><body>
<nav class="nav"><div class="nav-inner">
  <a href="index.html" class="logo"><div class="logo-mark">M</div><span>MarkLearn</span></a>
  <div class="nav-menu">
    <a href="notes.html" class="">노트</a>
    <a href="quiz.html" class="">퀴즈</a>
    <a href="stats.html" class="">통계</a>
    <a href="mypage.html" class="">마이페이지</a>
  </div>
  <a class="nav-cta" href="login.html">로그인</a>
</div></nav>

<div class="login-wrap"><div class="login-card">
  <div class="logo-mark">M</div>
  <h1>다시 오신 걸 환영해요</h1>
  <p>GitHub 계정으로 간편하게 시작하세요.</p>
  <button class="gh-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.73.5.99 5.24.99 11.51c0 4.85 3.14 8.96 7.5 10.41.55.1.75-.24.75-.53 0-.26-.01-.95-.01-1.86-3.05.66-3.69-1.47-3.69-1.47-.5-1.27-1.22-1.6-1.22-1.6-1-.68.07-.66.07-.66 1.1.08 1.68 1.13 1.68 1.13.98 1.68 2.57 1.19 3.2.91.1-.71.38-1.2.7-1.47-2.43-.28-4.99-1.22-4.99-5.43 0-1.2.43-2.18 1.13-2.95-.11-.28-.49-1.4.11-2.92 0 0 .92-.3 3.02 1.13.88-.24 1.82-.36 2.76-.36.94 0 1.88.12 2.76.36 2.1-1.43 3.02-1.13 3.02-1.13.6 1.52.22 2.64.11 2.92.7.77 1.13 1.75 1.13 2.95 0 4.22-2.57 5.15-5.01 5.42.39.34.74 1.01.74 2.04 0 1.47-.01 2.66-.01 3.02 0 .29.2.64.76.53 4.36-1.45 7.49-5.56 7.49-10.41C23.01 5.24 18.27.5 12 .5z"/></svg>GitHub으로 계속하기</button>
  <div class="divider">또는</div>
  <a href="notes.html" class="btn btn-ghost" style="width:100%;justify-content:center">게스트로 둘러보기</a>
  <p class="tos">계속 진행 시 이용약관과 개인정보처리방침에 동의하게 됩니다.</p>
</div></div>

<footer><div class="row"><a href="#">이용약관</a><a href="#">개인정보처리방침</a><a href="#">GitHub</a></div>
<div>© 2026 MarkLearn — 영남대학교 컴퓨터공학과 졸업작품</div></footer>
</body></html>
