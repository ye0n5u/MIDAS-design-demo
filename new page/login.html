<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>로그인 · MarkLearn</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --color-teal-500: #4DBDA3;
      --color-teal-200: #A8E0CD;
      --bg-base: #F6FBF9;
      --ink: #1f2937;
      --sub: #4b5563;
      --line: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      font-family: 'Pretendard', system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg-base);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .login-wrap {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 40px 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 20px;
      padding: 44px 36px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .06);
      text-align: center;
    }

    .logo-mark {
      width: 54px;
      height: 54px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--color-teal-200), var(--color-teal-500));
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      font-size: 22px;
      margin: 0 auto 18px;
    }

    .login-card h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .login-card p {
      color: var(--sub);
      font-size: 14.5px;
      margin-bottom: 30px;
    }

    .gh-btn {
      width: 100%;
      padding: 14px;
      background: #1f2937;
      color: #fff;
      border-radius: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 15px;
    }

    .btn-ghost {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-weight: 700;
      color: var(--ink);
      display: flex;
      justify-content: center;
      margin-top: 22px;
    }

    .divider {
      margin: 22px 0;
      color: #9ca3af;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }

    footer {
      padding: 30px 24px;
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
      margin-top: auto;
    }

    footer .row {
      display: flex;
      justify-content: center;
      gap: 22px;
      margin-bottom: 8px;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="logo-mark">M</div>
      <h1>다시 오신 걸 환영해요</h1>
      <p>GitHub 계정으로 간편하게 시작하세요.</p>
      <a href="dashboard.html" class="gh-btn">GitHub으로 계속하기</a>
      <div class="divider">또는</div>
      <a href="dashboard-empty.html" class="btn-ghost">게스트로 둘러보기</a>
    </div>
  </div>
  <footer>
    <div class="row"><a href="#">이용약관</a><a href="#">개인정보처리방침</a><a href="#">GitHub</a></div>
    <div>© 2026 MarkLearn — 영남대학교 컴퓨터공학과 졸업작품</div>
  </footer>
</body>

</html>
