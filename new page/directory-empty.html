<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>내 노트 · MarkLearn</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --color-teal-500: #4DBDA3;
            --color-teal-600: #3EA990;
            --color-teal-200: #A8E0CD;
            --color-teal-100: #D6F5EA;
            --bg-base: #F6FBF9;
            --bg-panel: #FFFFFF;
            --ink: #1f2937;
            --sub: #4b5563;
            --line: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            font-family: 'Pretendard', system-ui, sans-serif;
            color: var(--ink);
            background: var(--bg-base);
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
        }

        /* 공통 레이아웃 */
        .app-layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 200px;
            background: var(--color-teal-500);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .sidebar .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 22px 16px;
            font-weight: 800;
            font-size: 16px;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, .15);
            text-decoration: none;
        }

        .sidebar .s-logo {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: rgba(255, 255, 255, .25);
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 14px;
            color: #fff;
        }

        .sidebar nav {
            flex: 1;
            padding: 14px 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .sidebar nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 14px;
            border-radius: 10px;
            color: rgba(255, 255, 255, .7);
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            transition: 0.15s;
        }

        .sidebar nav a:hover,
        .sidebar nav a.active {
            background: rgba(255, 255, 255, .18);
            color: #fff;
        }

        .s-bottom {
            padding: 14px 10px;
            border-top: 1px solid rgba(255, 255, 255, .15);
        }

        .s-user {
            font-size: 12px;
            color: rgba(255, 255, 255, .5);
            padding: 4px 14px 6px;
            font-weight: 600;
        }

        .s-bottom a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 14px;
            border-radius: 10px;
            color: rgba(255, 255, 255, .7);
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* 휠을 만들기 위해 min-height: 100vh 설정 (디렉토리는 1200px) */
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .notes-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 24px;
            gap: 12px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -.5px;
            margin-bottom: 4px;
        }

        /* 노트 빈 화면 전용 디자인 */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-panel);
            border: 1px dashed var(--line);
            border-radius: 16px;
            padding: 60px 20px;
            text-align: center;
            margin-bottom: 40px;
            margin-top: 10px;
        }

        .empty-mascot {
            width: 80px;
            height: 80px;
            background: var(--color-teal-100);
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 36px;
            margin-bottom: 20px;
        }

        .empty-state h2 {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 10px;
            color: var(--ink);
        }

        .empty-state p {
            font-size: 15px;
            color: var(--sub);
            margin-bottom: 24px;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: var(--color-teal-500);
            color: #fff;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            text-decoration: none;
            transition: 0.15s;
            border: none;
            cursor: pointer;
        }

        .btn-primary:hover {
            background: var(--color-teal-600);
            transform: translateY(-2px);
        }

        /* 공통 푸터 (링크 색상 유지 포함) */
        .global-footer {
            padding: 30px 24px;
            text-align: center;
            background: var(--color-teal-500);
            color: rgba(255, 255, 255, 0.85);
            font-size: 13.5px;
            margin-top: auto;
        }

        .global-footer .row {
            display: flex;
            justify-content: center;
            gap: 22px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .global-footer a {
            color: inherit;
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .global-footer a:hover {
            color: #ffffff;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar">
            <a class="brand" href="landing.html">
                <div class="s-logo">M</div><span>MarkLearn</span>
            </a>
            <nav>
                <a href="dashboard-empty.html">📊 대시보드</a>
                <a href="create-empty.html">✏️ 학습 생성</a>
                <a href="directory-empty.html" class="active">📝 노트</a>
            </nav>
            <div class="s-bottom">
                <div class="s-user">김영남</div>
                <a href="mypage-empty.html">👤 마이페이지</a>
            </div>
        </aside>

        <main class="main-content">
            <div class="container">
                <div class="notes-head">
                    <div>
                        <div class="page-title">내 노트</div>
                        <div style="color:var(--sub); font-size:14px;">총 0개의 노트</div>
                    </div>
                </div>

                <div class="empty-state">
                    <div class="empty-mascot">📁</div>
                    <h2>작성된 노트가 없어요!</h2>
                    <p>에디터를 열어 나만의 첫 마크다운 노트를 작성해 보세요.</p>
                    <a href="editor.html" class="btn-primary"><span>+</span> 새 노트 작성하기</a>
                </div>
            </div>

            <footer class="global-footer">
                <div class="row">
                    <a href="#">이용약관</a>
                    <a href="#">개인정보처리방침</a>
                    <a href="#">GitHub</a>
                </div>
                <div>© 2026 MarkLearn — 영남대학교 컴퓨터공학과 졸업작품</div>
            </footer>
        </main>
    </div>
</body>

</html>
