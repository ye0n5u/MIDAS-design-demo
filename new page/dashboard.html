<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>학습 통계 · MarkLearn</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#3B9E85; --green-1:#5CBD9E; --green-2:#8DD6B6; --olive:#8DD6B6;
  --gray:#F0FAF6; --ink:#1f2937; --sub:#4b5563;
  --primary:#3B9E85; --primary-2:#2E8A72; --bg:#F2F9F6; --line:#e5e7eb;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}

.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid #eee}
.nav-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 24px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.logo-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--green-1),var(--olive));display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;box-shadow:0 4px 12px rgba(59,158,133,.4)}
.nav-menu{display:flex;gap:28px;font-weight:600;color:var(--sub);font-size:15px}
.nav-menu a:hover,.nav-menu a.active{color:var(--ink)}
.nav-menu a.active{color:var(--primary)}
.nav-cta{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:14px}
.nav-cta:hover{background:#000}

footer{background:var(--pink);padding:30px 24px;text-align:center;color:rgba(255,255,255,.85);font-size:13.5px;margin-top:80px}
footer .row{display:flex;justify-content:center;gap:22px;margin-bottom:8px;font-weight:600}

.container{max-width:1180px;margin:0 auto;padding:32px 24px}
.page-title{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.page-sub{color:var(--sub);margin-bottom:28px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;font-weight:700;font-size:14px;transition:transform .15s ease}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-2);transform:translateY(-1px)}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{background:#f3f4f6}
input[type=text],input[type=email],textarea,select{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px;background:#fff;color:var(--ink);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--primary)}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
.kpi .label{font-size:13px;color:var(--sub);font-weight:600}
.kpi .value{font-size:28px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.kpi .delta{font-size:12px;font-weight:700;margin-top:4px}
.kpi .delta.up{color:#16a34a}
.kpi .delta.down{color:#dc2626}
.charts{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.chart-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px}
.chart-card h3{font-size:16px;font-weight:700;margin-bottom:18px}
.bar-chart{display:flex;align-items:flex-end;gap:14px;height:220px;padding:0 6px}
.bar-chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bar-chart .bar{width:100%;background:linear-gradient(180deg,var(--green-1),var(--olive));border-radius:8px 8px 0 0;min-height:6px;transition:height .3s ease}
.bar-chart .lbl{font-size:12px;color:var(--sub);font-weight:600}
.bar-chart .val{font-size:11px;color:#9ca3af}
.donut{display:flex;align-items:center;gap:20px}
.donut svg{width:140px;height:140px;flex-shrink:0}
.legend{display:flex;flex-direction:column;gap:8px;font-size:13px}
.legend .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:middle}
@media(max-width:900px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}}
</style></head><body>
<nav class="nav"><div class="nav-inner">
  <a href="landing.html" class="logo"><div class="logo-mark">M</div><span>MarkLearn</span></a>
  <div class="nav-menu">
    <a href="directory.html" class="">노트</a>
    <a href="quiz.html" class="">퀴즈</a>
    <a href="dashboard.html" class="active">통계</a>
    <a href="mypage.html" class="">마이페이지</a>
  </div>
  <a class="nav-cta" href="login.html">로그인</a>
</div></nav>

<div class="container">
  <div class="page-title">학습 통계</div>
  <div class="page-sub">최근 7일 학습 기록</div>
  <div class="kpi-grid">
    <div class="kpi"><div class="label">총 학습 시간</div><div class="value">23.5h</div><div class="delta up">▲ 12% vs 지난주</div></div>
    <div class="kpi"><div class="label">작성한 노트</div><div class="value">14개</div><div class="delta up">▲ 4개</div></div>
    <div class="kpi"><div class="label">퀴즈 정답률</div><div class="value">78%</div><div class="delta up">▲ 5%p</div></div>
    <div class="kpi"><div class="label">연속 학습일</div><div class="value">12일 🔥</div><div class="delta up">목표까지 3일</div></div>
  </div>
  <div class="charts">
    <div class="chart-card"><h3>요일별 학습 시간</h3><div class="bar-chart"><div class="col"><div class="val">2.5h</div><div class="bar" style="height:84px"></div><div class="lbl">월</div></div><div class="col"><div class="val">3.2h</div><div class="bar" style="height:108px"></div><div class="lbl">화</div></div><div class="col"><div class="val">1.8h</div><div class="bar" style="height:61px"></div><div class="lbl">수</div></div><div class="col"><div class="val">4.1h</div><div class="bar" style="height:139px"></div><div class="lbl">목</div></div><div class="col"><div class="val">2.9h</div><div class="bar" style="height:98px"></div><div class="lbl">금</div></div><div class="col"><div class="val">5.3h</div><div class="bar" style="height:180px"></div><div class="lbl">토</div></div><div class="col"><div class="val">3.7h</div><div class="bar" style="height:125px"></div><div class="lbl">일</div></div></div></div>
    <div class="chart-card"><h3>주제별 비중</h3>
      <div class="donut">
        <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.9" fill="none" stroke="#e5e7eb" stroke-width="4"/>
          <circle cx="18" cy="18" r="15.9" fill="none" stroke="#5CBD9E" stroke-width="4" stroke-dasharray="40 100" stroke-dashoffset="0" transform="rotate(-90 18 18)"/>
          <circle cx="18" cy="18" r="15.9" fill="none" stroke="#8DD6B6" stroke-width="4" stroke-dasharray="30 100" stroke-dashoffset="-40" transform="rotate(-90 18 18)"/>
          <circle cx="18" cy="18" r="15.9" fill="none" stroke="#3B9E85" stroke-width="4" stroke-dasharray="20 100" stroke-dashoffset="-70" transform="rotate(-90 18 18)"/>
        </svg>
        <div class="legend">
          <div><span class="dot" style="background:#5CBD9E"></span>알고리즘 40%</div>
          <div><span class="dot" style="background:#8DD6B6"></span>React 30%</div>
          <div><span class="dot" style="background:#3B9E85"></span>Python 20%</div>
          <div><span class="dot" style="background:#e5e7eb"></span>기타 10%</div>
        </div>
      </div>
    </div>
  </div>
</div>

<footer><div class="row"><a href="#">이용약관</a><a href="#">개인정보처리방침</a><a href="#">GitHub</a></div>
<div>© 2026 MarkLearn — 영남대학교 컴퓨터공학과 졸업작품</div></footer>
</body></html>
